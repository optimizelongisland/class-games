<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Systems Card Sort: Graphing</title>
<style>
  :root{--bg:#10141c;--grid:#1c2330;--ink:#111;--card:#fff;--line:#222;--accent:#ffb347;--good:#1f9d55;--bad:#d64545;--sel:#2f7cf6}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f2f2f2;min-height:100vh;
    background-color:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;-webkit-user-select:none;user-select:none}
  header{text-align:center;padding:16px 16px 6px}
  h1{margin:0;font-size:clamp(1.5rem,4vw,2.3rem);letter-spacing:.03em}
  h1 small{display:block;font-size:.42em;letter-spacing:.25em;color:var(--accent);margin-bottom:4px}
  .dir{max-width:760px;margin:6px auto 0;font-size:1rem;color:#cfd6e2;line-height:1.4}
  main{max-width:1240px;margin:0 auto;padding:10px 16px 70px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}}

  .rows{display:flex;flex-direction:column;gap:10px}
  .row{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(120px,1fr) 150px 34px;gap:10px;align-items:center;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px}
  .row.allgood{background:rgba(31,157,85,.22);border-color:var(--good)}
  .rowmark{font-size:1.4rem;text-align:center}

  .card{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:6px;position:relative;
    display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.2rem;line-height:1.45;touch-action:none}
  .card .tag{position:absolute;left:6px;top:2px;font-weight:800;font-size:.95rem}
  .sys{height:110px;cursor:default}
  .sys .eq{font-size:1.25rem}
  .sol,.gr{cursor:grab}
  .sol{height:110px;font-size:1.3rem}
  .gr{height:150px;width:150px;padding:18px 4px 4px}
  .gr img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
  .card.selected{outline:4px solid var(--sel);outline-offset:2px}
  .card.right{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
  .card.wrong{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad);animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  .slot{border:3px dashed rgba(255,255,255,.35);border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.55);font-size:.9rem;text-align:center;padding:4px}
  .slot.s-sol{height:116px}
  .slot.s-gr{height:156px;width:156px;justify-self:center;margin:-3px}
  .slot.filled{border:0;padding:0}
  .slot.filled>.card{width:100%}
  .slot.hot{border-color:var(--accent);background:rgba(255,179,71,.15);color:#fff}
  .slot.can{border-color:var(--sel)}

  aside{position:sticky;top:10px;max-height:calc(100vh - 20px);display:flex;flex-direction:column;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px}
  @media (max-width:900px){aside{position:static;max-height:none}}
  aside h2{margin:0 0 8px;font-size:1.05rem;color:var(--accent)}
  .tray{overflow-y:auto;flex:1;display:grid;align-content:start;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-height:80px;border-radius:10px;padding:4px}
  @media (max-width:900px){.tray{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
  .tray.hot{background:rgba(255,179,71,.15)}
  .tray .gr{width:100%;height:auto;aspect-ratio:1}
  .tray .empty{grid-column:1/-1;color:#cfd6e2;text-align:center;font-size:.95rem;padding:14px 4px}

  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;flex:1}
  .go{background:var(--accent);color:#3b1f00}
  .ghost{background:#2a3242;color:#f2f2f2}
  .msg{margin-top:10px;min-height:1.4em;font-weight:600;text-align:center;line-height:1.35}

  .ghostcard{position:fixed;z-index:1000;pointer-events:none;opacity:.92;transform:rotate(3deg);box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .win{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
  .win.show{display:flex}
  .win div{background:#fff;color:#111;border-radius:16px;padding:26px 28px;text-align:center;max-width:420px}
  .win b{display:block;font-size:2rem;margin-bottom:6px}
  .win button{margin-top:14px;width:100%}
  @media (max-width:560px){
    .row{grid-template-columns:1fr 1fr;grid-template-areas:"s s" "a b"}
    .row .sys{grid-area:s}.rowmark{display:none}
    .slot.s-gr,.slot.s-gr .gr{width:100%;height:auto;aspect-ratio:1}
    .slot.s-sol{height:100%}
  }
</style>
</head>

<header>
  <h1><small>CARD SORT</small>Systems of Equations: Graphing</h1>
  <p class="dir">Match each system of equations with its <b>solution</b> and its <b>graph</b>. Drag a card into a box, or tap a card and then tap a box. Press <b>Check</b> when you're ready.</p>
</header>
<main>
  <section class="rows" id="rows"></section>
  <aside>
    <h2>Cards</h2>
    <div class="tray" id="tray"></div>
    <div class="bar">
      <button class="go" id="check">Check</button>
      <button class="ghost" id="reset">Start over</button>
    </div>
    <div class="msg" id="msg"></div>
  </aside>
</main>

};
/* Cards from the paper card sort. Answer key: 1-b-F, 2-d-C, 3-c-B, 4-a-D, 5-e-A, 6-f-E */
const SYSTEMS = [
  {n:'1', eq:['2y − x = 10','y = 3x'], sol:'b', gr:'F'},
  {n:'2', eq:['½x + 2y = 4','4y = −x + 8'], sol:'d', gr:'C'},
  {n:'3', eq:['2y − 3 = y + 2','−⅕y = x'], sol:'c', gr:'B'},
  {n:'4', eq:['3x + 4 = −y','4y = −12x + 8'], sol:'a', gr:'D'},
  {n:'5', eq:['y = 2x − 6','3x + y = 4'], sol:'e', gr:'A'},
  {n:'6', eq:['x + y = −1','2y = −x'], sol:'f', gr:'E'}
];
const SOLS = {a:'No<br>Solution', b:'(2, 6)', c:'(−1, 5)', d:'Infinite<br>Solutions', e:'(2, −2)', f:'(−2, 1)'};
const CARDS = {};
Object.keys(SOLS).forEach(k => CARDS['s' + k] = {id:'s' + k, kind:'sol', tag:k, html:SOLS[k]});
Object.keys(GRAPH_IMG).forEach(k => CARDS['g' + k] = {id:'g' + k, kind:'gr', tag:k, html:'<img alt="Graph ' + k + '" src="' + GRAPH_IMG[k] + '">'});

const KEY = 'systems-card-sort-graphing';
let state; // {order:[cardIds in tray order], place:{slotId:cardId}, marks:{slotId:true/false}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return {order:shuffle(Object.keys(CARDS)), place:{}, marks:{}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(state))}catch(e){}}
try{state = JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state || !state.order || state.order.length !== Object.keys(CARDS).length) state = fresh();

let selected = null;
const $ = id => document.getElementById(id);
const cardEl = (c, mark) => '<div class="card ' + c.kind + (selected === c.id ? ' selected' : '') + (mark === true ? ' right' : mark === false ? ' wrong' : '') + '" data-card="' + c.id + '"><span class="tag">' + (c.kind === 'gr' ? c.tag : c.tag + '.') + '</span>' + c.html + '</div>';
const placed = () => new Set(Object.values(state.place));

function render(){
  const sel = selected && CARDS[selected];
  $('rows').innerHTML = SYSTEMS.map(s => {
    const slots = [['sol','Solution'],['gr','Graph']].map(([k,label]) => {
      const id = k + s.n, c = state.place[id] && CARDS[state.place[id]];
      return '<div class="slot s-' + k + (c ? ' filled' : '') + (sel && !c && sel.kind === k ? ' can' : '') + '" data-slot="' + id + '" data-kind="' + k + '">' + (c ? cardEl(c, state.marks[id]) : 'Drop a ' + label.toLowerCase() + ' here') + '</div>';
    }).join('');
    const good = state.marks['sol' + s.n] === true && state.marks['gr' + s.n] === true;
    return '<div class="row' + (good ? ' allgood' : '') + '"><div class="card sys"><span class="tag">' + s.n + '.</span><div class="eq">' + s.eq.join('<br>') + '</div></div>' + slots + '<div class="rowmark">' + (good ? '✅' : '') + '</div></div>';
  }).join('');
  const p = placed(), left = state.order.filter(id => !p.has(id));
  $('tray').innerHTML = left.length ? left.map(id => cardEl(CARDS[id])).join('') : '<div class="empty">All cards are placed. Press <b>Check</b>!</div>';
}

function correctFor(slotId){const s = SYSTEMS.find(x => x.n === slotId.slice(-1)); return slotId.startsWith('sol') ? 's' + s.sol : 'g' + s.gr}
function slotOf(cardId){return Object.keys(state.place).find(k => state.place[k] === cardId)}

function move(cardId, slotId){ // slotId null = back to tray
  const from = slotOf(cardId);
  if (from === slotId) return;
  if (from){delete state.place[from]; delete state.marks[from]}
  if (slotId){
    const kind = slotId.startsWith('sol') ? 'sol' : 'gr';
    if (CARDS[cardId].kind !== kind){
      if (from) state.place[from] = cardId;
      flash(kind === 'gr' ? 'That box needs a graph card.' : 'That box needs a solution card.'); return;
    }
    const old = state.place[slotId];
    if (old && from) state.place[from] = old; // swap
    state.place[slotId] = cardId; delete state.marks[slotId];
    if (from) delete state.marks[from];
  }
  $('msg').textContent = '';
  save(); render();
}
function flash(t){$('msg').textContent = t}

/* ---- Drag (mouse + touch) and tap-to-place ---- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.card[data-card]');
  if (!c || e.button > 0) return;
  e.preventDefault();
  drag = {id:c.dataset.card, el:c, x:e.clientX, y:e.clientY, moved:false, ghost:null, dx:0, dy:0};
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
  if (!drag.moved){
    drag.moved = true;
    const r = drag.el.getBoundingClientRect();
    drag.dx = drag.x - r.left; drag.dy = drag.y - r.top;
    const g = drag.el.cloneNode(true);
    g.classList.add('ghostcard'); g.classList.remove('selected','wrong','right');
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    document.body.appendChild(g); drag.ghost = g; drag.el.style.opacity = .3;
    autoScroll();
  }
  drag.cx = e.clientX; drag.cy = e.clientY;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  document.querySelectorAll('.hot').forEach(x => x.classList.remove('hot'));
  const t = dropTarget(e); if (t) t.classList.add('hot');
});
function autoScroll(){ // scroll the page when dragging near the top or bottom edge
  if (!drag || !drag.ghost) return;
  const edge = 70, y = drag.cy, h = innerHeight;
  if (y != null && y < edge) scrollBy(0, -(edge - y) / 4);
  else if (y != null && y > h - edge) scrollBy(0, (y - (h - edge)) / 4);
  requestAnimationFrame(autoScroll);
}
function dropTarget(e){
  const u = document.elementFromPoint(e.clientX, e.clientY);
  return u && (u.closest('.slot') || u.closest('aside'));
}
function endDrag(e){
  if (!drag) return;
  const d = drag; drag = null;
  document.querySelectorAll('.hot').forEach(x => x.classList.remove('hot'));
  if (d.ghost){
    d.ghost.remove(); d.el.style.opacity = '';
    const t = e && dropTarget(e);
    selected = null;
    if (t && t.dataset.slot) move(d.id, t.dataset.slot);
    else if (t) move(d.id, null);
    else render();
  } else { // tap
    const inSlot = d.el.closest('.slot');
    if (selected && selected !== d.id && inSlot){ const id = selected; selected = null; move(id, inSlot.dataset.slot); return }
    selected = selected === d.id ? null : d.id; render();
  }
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', () => { if (drag && drag.ghost){drag.ghost.remove(); drag.el.style.opacity = ''} drag = null; render() });
document.addEventListener('click', e => {
  if (!selected) return;
  const s = e.target.closest('.slot');
  if (s && !s.classList.contains('filled')){ const id = selected; selected = null; move(id, s.dataset.slot) }
  else if (e.target.closest('#tray') && slotOf(selected)){ const id = selected; selected = null; move(id, null) }
});

$('check').onclick = () => {
  const ids = Object.keys(state.place);
  if (!ids.length){flash('Place some cards first.'); return}
  let right = 0;
  ids.forEach(id => { const ok = state.place[id] === correctFor(id); state.marks[id] = ok; if (ok) right++ });
  save(); render();
  if (right === 12){ $('msg').textContent = '12 out of 12 correct!'; $('win').classList.add('show'); return }
  const wrong = ids.length - right, empty = 12 - ids.length;
  $('msg').innerHTML = right + ' of 12 correct.' + (wrong ? ' Fix the <span style="color:#ff7b7b">red</span> card' + (wrong > 1 ? 's' : '') + '.' : '') + (empty ? ' ' + empty + ' box' + (empty > 1 ? 'es' : '') + ' still empty.' : '');
};
function restart(){state = fresh(); selected = null; $('msg').textContent = ''; $('win').classList.remove('show'); save(); render()}
$('reset').onclick = () => { if (confirm('Start over? This clears your matches.')) restart() };
$('again').onclick = restart;
render();
</script>
