<style>
/* Layout: scale + move buttons on the left, written work on the right; stacks on phones. */
:root{
  --bg:#000; --panel:#0d0d12; --panel2:#15151c; --line:#2a2a35;
  --fg:#f5f5f8; --mute:#a2a2b6;
  --pink:#ff4fa8; --green:#35f09a;

  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --body:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;
  --m:clamp(1.55rem,.9rem + 1.4vw,2.9rem);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:clamp(17px,.9vw + 11px,26px);-webkit-text-size-adjust:100%}

  padding-inline:clamp(16px,2.4vw,44px);padding-block:.8rem 2.5rem;overflow-x:hidden}
.app{max-width:1800px;margin:0 auto}
button{font:inherit;color:inherit}
i{font-style:italic}

/* header */

.pk{color:var(--pink)} .yl{color:var(--yellow)} .gr{color:var(--green)}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-inline-start:auto}

/* buttons */
.btn{font-family:var(--body);font-weight:600;font-size:1.05rem;min-height:3.2rem;padding:.55rem 1.1rem;
  border-radius:14px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;
  transition:transform .08s,filter .15s,background .15s}
.btn:active{transform:translateY(2px) scale(.98)}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--fg);outline-offset:3px}

.fill.cyan{background:var(--cyan);--glow:var(--cyan)} .fill.yellow{background:var(--yellow);--glow:var(--yellow)}
.fill.orange{background:var(--orange);--glow:var(--orange)} .fill.violet{background:var(--violet)}

.chip.rand{font:600 1rem var(--body);border-color:var(--violet);color:var(--violet)}

.stage{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:clamp(18px,2.6vw,48px);align-items:start}

.mv .op:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.mat{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.5rem;align-items:stretch}
.side{--c:var(--pink);border:3px solid var(--c);border-radius:16px;padding:.7rem;min-height:15rem;display:flex;flex-direction:column;gap:.55rem;background:var(--panel)}
.side.sR{--c:var(--green)}
.trow{display:flex;flex-wrap:wrap;gap:.35rem;align-content:flex-start}
.trow:empty{display:none}
.tile{display:grid;place-items:center;border:2px solid #000;color:#000;font:700 1.05rem var(--mono);flex:none}
.tile.x{width:2.1rem;height:3.7rem;border-radius:7px;font-style:italic}
.tile.u{width:1.65rem;height:1.65rem;border-radius:5px;font-size:1rem}
.tile.x.pos{background:var(--green)} .tile.u.pos{background:var(--yellow)} .tile.neg{background:var(--red)}
.tile.new{outline:3px dashed var(--fg);outline-offset:2px}
.pr{display:inline-flex;flex-direction:column;align-items:center;gap:.3rem;padding:.25rem;border:2px solid #fff;border-radius:9px;box-shadow:0 0 14px 2px rgba(255,255,255,.55);flex:none}
.pr .tile.new{outline:0}
.pr.pop{animation:pop .5s ease-in forwards}
.mat .eqs{align-self:center;font:800 2.6rem var(--mono)}
.side .ex{margin-top:auto;text-align:center;font:600 1.6rem var(--mono);color:var(--c)}
.side .ex.zero{color:var(--mute)}
.side .wd{text-align:center;letter-spacing:.24em;font-weight:600;color:var(--c);font-size:.8rem}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;margin:0 0 .7rem;color:var(--mute);font-size:.95rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend .tile.x{width:1.2rem;height:2rem;font-size:.75rem}
.legend .tile.u{width:1.2rem;height:1.2rem;font-size:.75rem}
.mv .go{flex-basis:100%;border:0;border-radius:10px;background:#000;color:var(--fg);font:700 1rem var(--body);min-height:2.4rem;cursor:pointer}
.mv .go:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.mv i{font-family:var(--mono);font-weight:600}
.coach{animation:glow 1.15s ease-out infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--glow,#fff)}75%,100%{box-shadow:0 0 0 .8rem rgba(255,255,255,0)}}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem;margin-top:.7rem}
.tools .btn{padding-inline:.4rem}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* cards + math */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(14px,1.6vw,26px)}
.card+.card{margin-top:1rem}
.cap{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:.4rem}
.cap b{margin-left:.9rem}
.gridwrap{overflow-x:auto;overflow-y:hidden}
.grid{display:grid;grid-template-columns:repeat(7,auto);justify-content:center;align-items:center;
  font-family:var(--mono);font-size:var(--m);font-weight:500;line-height:1.2;width:max-content;max-width:none;margin-inline:auto}
.c{padding:.1em .15em;text-align:center;white-space:nowrap}
.c.cl{color:var(--pink)} .c.cr{color:var(--green)} .c.eq{color:var(--fg);padding-inline:.45em}
.pl{opacity:.8}
.neq{color:var(--red)}
.op{font-weight:600}
.ln{grid-column:1/-1;height:5px;border-radius:3px;margin:.05em .2em;background:linear-gradient(90deg,var(--pink),var(--green))}
.ln.bad{background:var(--red)}
.gap{grid-column:1/-1;height:.55rem}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15}
.frac .n{padding:0 .3em .06em;border-bottom:.07em solid currentColor}

.new{animation:rise .5s both}

.sm{margin:0 0 .8rem;color:var(--mute)}
.check{margin-top:1rem}
.check .grid{font-size:calc(var(--m)*.8)}
.cap2{margin:0 0 .3rem;color:var(--mute)}
.cap2 i{font-family:var(--mono)}
.match{display:flex;align-items:center;justify-content:center;gap:.6rem;margin:.8rem 0 0;font:600 1.3rem var(--mono);color:var(--green)}
.tick{width:1.8rem;height:1.8rem;fill:none;stroke:var(--green);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.next{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;margin-top:1.1rem}

/* warm-up copy */
h2{font:800 clamp(1.7rem,1.2rem + 1.4vw,2.7rem)/1.05 var(--disp);letter-spacing:-.01em;margin:.2rem 0 .5rem}
.lead{font-size:1.2rem;margin:0 0 1rem;color:var(--fg)}
.lead i,.status i{font-family:var(--mono)}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin:.4rem 0 1rem}
.choice{font:600 1.7rem var(--mono);min-height:4rem;border-radius:14px;border:2px solid var(--cyan);color:var(--cyan);background:transparent;cursor:pointer}
.choice.bad{border-color:var(--red);color:var(--red);opacity:.6}
.choice.ok{background:var(--green);border-color:var(--green);color:#000}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.steps{list-style:none;margin:.6rem 0 1rem;padding:0;display:grid;gap:.8rem}
.steps li{display:flex;gap:.9rem;align-items:flex-start}
.steps b{flex:none;display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--k);color:#000;font:800 1.3rem var(--disp)}
.steps h3{margin:0;font:800 1.3rem/1.2 var(--disp)}
.steps p{margin:.1rem 0 0;color:var(--mute)}
.steps i{font-family:var(--mono)}
.small{font-size:.95rem;color:var(--mute);margin:.8rem 0 0}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:16px;z-index:10}
.overlay[hidden]{display:none}
.overlay .card{width:min(640px,100%);background:#0d0d12;border-color:#3a3a48}

@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .tabs{margin-inline-start:0}
}
@media (max-width:520px){
  .tools{grid-template-columns:repeat(2,minmax(0,1fr))}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

</style>

    <h2>How this works</h2>
    <div id="howsteps"></div>
    <p class="small">Tabs 1 to 3 use whole numbers. Tab 4 adds negative numbers with algebra tiles: green is <i>x</i>, yellow is +1, red is negative. A red and a matching positive tile make a zero pair and cancel out.</p>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var mn=Math.min;

var X='<i>x</i>';

/* ---------- puzzles ---------- */
var GUIDED={a:3,b:2,c:1,d:8,v:3};
var PUZZLES=[
  {a:2,b:3,c:1,d:7,v:4},
  {a:4,b:3,c:2,d:9,v:3},
  {a:4,b:1,c:1,d:10,v:3},
  {a:5,b:4,c:2,d:19,v:5},

  {a:6,b:5,c:2,d:21,v:4},
  {a:7,b:3,c:4,d:24,v:7},
  {a:8,b:4,c:5,d:19,v:5}

  {a:2,b:5,c:4,d:-3,v:4},
  {a:4,b:9,c:1,d:-3,v:-4},
  {a:-2,b:5,c:1,d:-4,v:3,note:'Heads up: there is a negative x on the left.'},
  {a:5,b:-2,c:2,d:-11,v:-3},
  {a:-3,b:-4,c:-1,d:6,v:-5},
  {a:6,b:1,c:2,d:-7,v:-2},
  {a:-4,b:3,c:-7,d:-9,v:-4}

    if(!a||!c||!v||a===c)continue;

  {s:{a:0,b:4,c:0,d:4},v:1},
  {s:{a:1,b:2,c:0,d:5},v:3},
  {s:{a:3,b:2,c:1,d:8},v:3}
];

  for(;;){
    var c=1+Math.floor(Math.random()*4),k=1+Math.floor(Math.random()*3),a=c+k;
    var v=1+Math.floor(Math.random()*7),b=1+Math.floor(Math.random()*8),d=b+k*v;
    if(d>24)continue;
    return Math.random()<.3?{a:c,b:d,c:a,d:b,v:v}:{a:a,b:b,c:c,d:d,v:v};
  }
}
function mkGame(p,idx){return {start:{a:p.a,b:p.b,c:p.c,d:p.d},v:p.v,idx:idx,note:p.note,hist:[],cheat:null,checked:false}}
var G={guided:mkGame(GUIDED,'g'),practice:mkGame(PUZZLES[0],0),neg:mkGame(NEG[0],0)};
var S={tab:'warm',beat:0,guessOk:false,guessBad:null,done:{},busy:false,fresh:false,hintMv:null,msg:{t:'',k:'info'}};
function game(){return G[S.tab]}
function isNeg(){return S.tab==='neg'}
function cur(g){return g.hist.length?g.hist[g.hist.length-1].to:g.start}
function view(g){
  var s=cur(g),c=g.cheat;if(!c)return s;
  var t={a:s.a,b:s.b,c:s.c,d:s.d};
  if(c.side==='L'){if(c.kind==='c')t.b-=c.m;else t.a-=c.m}
  else{if(c.kind==='c')t.d-=c.m;else t.c-=c.m}
  return t;
}

/* ---------- math rules ---------- */
function isSolved(s){return (s.a===1&&s.b===0&&s.c===0)||(s.a===0&&s.c===1&&s.d===0)}
function canDiv(s){
  if(s.b===0&&s.c===0&&s.a>1)return s.a;
  if(s.a===0&&s.d===0&&s.c>1)return s.c;
  return 0;
}
function ready(t,s){return t==='subx'?mn(s.a,s.c)>0:t==='subc'?mn(s.b,s.d)>0:canDiv(s)>0}
function nextMove(s){
  if(mn(s.a,s.c)>0)return 'subx';
  if(mn(s.b,s.d)>0)return 'subc';
  if(canDiv(s))return 'div';
  return null;
}
function applyMove(t,s,k){
  if(t==='subx')return {m:k,to:{a:s.a-k,b:s.b,c:s.c-k,d:s.d}};
  if(t==='subc')return {m:k,to:{a:s.a,b:s.b-k,c:s.c,d:s.d-k}};
  if(t==='addx')return {m:k,to:{a:s.a+k,b:s.b,c:s.c+k,d:s.d}};
  if(t==='addc')return {m:k,to:{a:s.a,b:s.b+k,c:s.c,d:s.d+k}};
  return {m:k,to:{a:s.a/k,b:s.b/k,c:s.c/k,d:s.d/k}};
}
/* the student picks the amount; return a message if it does not work, or '' if it does */
function badAmount(t,s,k){
  var pl=function(n,w){return n+' '+w+(n===1?'':'s')};
  if(!(k>=1))return t==='div'?'Type the number to divide both sides by, then press Go.':'Type how many to take away, then press Go.';
  if(t==='subx'){
    var lack=s.a<k?['left',s.a]:s.c<k?['right',s.c]:null;
    if(lack)return 'The '+lack[0]+' side only has '+lack[1]+' <i>x</i>'+(lack[1]===1?'':'\'s')+'. You can\'t take away '+k+' from both sides.';
    return '';
  }
  if(t==='subc'){
    var lk=s.b<k?['left',s.b]:s.d<k?['right',s.d]:null;
    if(lk)return 'The '+lk[0]+' side only has '+pl(lk[1],'one')+'. You can\'t take away '+k+' from both sides.';
    return '';
  }
  if(k===1)return 'Dividing by 1 changes nothing. Try another number.';
  if(s.a%k||s.b%k||s.c%k||s.d%k)return 'Both sides have to split into '+k+' equal piles with nothing left over. Try another number.';
  return '';
}
function notReady(t,s){
  if(t==='subx')return (s.a===0&&s.c===0)?'No x\'s left to take.':'Only one side has <i>x</i>. Nothing to take from both.';
  if(t==='subc')return (s.b===0&&s.d===0)?'No ones left to take.':'One side has no ones. Nothing to take from both.';
  return 'Get <i>x</i> alone on one side first.';
}
function negNext(s){
  if(s.a!==0&&s.c!==0)return 'x';
  var xl=s.a!==0,k=xl?s.b:s.d;
  if(k!==0)return 'c';
  if((s.a||s.c)!==1)return 'div';
  return null;
}
function negBad(t,s,k){
  if(t==='div'){
    if(!k&&k!==0||isNaN(k))return 'Type the number to divide both sides by, then press Go. It can be negative.';
    if(k===0)return 'You can\'t divide by 0. Try another number.';
    if(k===1)return 'Dividing by 1 changes nothing. Try another number.';
    if(s.a%k||s.b%k||s.c%k||s.d%k)return 'Every number on both sides has to divide evenly by '+num(k)+'. Try another number.';
    return '';
  }
  if(isNaN(k)||k<1)return 'Type how many, then press Go. Use Add or Subtract to choose the direction.';
  if(k>40)return 'That is a lot. Try a smaller number.';
  return '';
}
function negHint(s){
  var n=negNext(s);
  if(n==='x')return 'Clear the <i>x</i>\'s off one side. If a side has +'+xt(2)+', subtract '+xt(2)+'. If it has '+xt(-2)+', add '+xt(2)+'.';
  if(n==='c')return 'Now clear the number next to <i>x</i>. Subtract it if it is positive. Add it if it is negative.';
  if(n==='div')return 'Divide both sides by the number in front of <i>x</i>. Keep its sign.';
  return 'You are done. Plug it back in to check.';
}
function hintText(mv,s){
  if(mv==='subx')return 'Look at the <i>x</i>\'s. Which side has fewer? Take away that many from both sides to clear the <i>x</i>\'s off one side.';
  if(mv==='subc')return 'Look at the ones. Which side has fewer? Take away that many from both sides.';
  return '<i>x</i> is on one side. What number is in front of <i>x</i>? Divide both sides by it.';
}

/* ---------- written work ---------- */
function sideCells(a,b){
  if(a===0)return ['','',num(b)];
  return [xt(a),b!==0?'<span class="pl">'+(b<0?'−':'+')+'</span>':'',b!==0?String(Math.abs(b)):''];
}
function sideText(a,b){var c=sideCells(a,b);return [c[0],c[1].replace(/<[^>]+>/g,''),c[2]].filter(Boolean).join(' ')}
function cells(s,eq){
  var L=sideCells(s.a,s.b),R=sideCells(s.c,s.d);
  return [L[0],L[1],L[2],eq?'<span class="neq">'+eq+'</span>':'=',R[0],R[1],R[2]];
}
function frac(n,d){return '<span class="frac"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>'}
function opCells(st){
  var o=['','','','','','',''];
  if(st.type==='subx'){o[0]='−'+xt(st.m);o[4]=o[0]}
  else if(st.type==='addx'){o[0]='+'+xt(st.m);o[4]=o[0]}
  else if(st.type==='addc'){o[2]='+'+st.m;o[6]=o[2]}
  else{o[2]='−'+st.m;o[6]=o[2]}
  return o;
}
function fracCells(s,k){
  var o=['','','','=','','',''];
  var L=frac(sideText(s.a,s.b),num(k)),R=frac(sideText(s.c,s.d),num(k));
  if(s.a!==0)o[0]=L;else o[2]=L;
  if(s.c!==0)o[4]=R;else o[6]=R;
  return o;
}
function cheatOpCells(c){
  var o=['','','','','','',''],t=c.kind==='c'?'−'+c.m:'−'+xt(c.m);
  var i=c.side==='L'?(c.kind==='c'?2:0):(c.kind==='c'?6:4);
  o[i]=t;return o;
}
function gridBuilder(){
  var h='',r=1;
  return {
    row:function(arr,cls,delay){
      arr.forEach(function(html,i){
        if(html===''||html==null)return;
        var side=i<3?'cl':i===3?'eq':'cr';
        h+='<div class="c '+side+' '+(cls||'')+'" style="grid-column:'+(i+1)+';grid-row:'+r+(delay!=null?';animation-delay:'+delay+'ms':'')+'">'+html+'</div>';
      });r++;
    },
    line:function(cls,delay){h+='<div class="ln '+(cls||'')+'" style="grid-row:'+r+(delay!=null?';animation-delay:'+delay+'ms':'')+'"></div>';r++},
    gap:function(){h+='<div class="gap" style="grid-row:'+r+'"></div>';r++},
    html:function(){return h}
  };
}
function workHTML(g){
  var b=gridBuilder();
  b.row(cells(g.start));
  g.hist.forEach(function(st,k){
    var nw=(S.fresh&&k===g.hist.length-1)?' new':'';
    b.gap();
    if(st.type==='div'){b.row(fracCells(st.from,st.m),'fr'+nw,0);b.row(cells(st.to),'res'+nw,450)}
    else{b.row(opCells(st),'op'+nw,0);b.line(nw.trim(),200);b.row(cells(st.to),'res'+nw,550)}
  });
  if(g.cheat){
    b.gap();b.row(cheatOpCells(g.cheat),'op new',0);b.line('bad new',200);b.row(cells(view(g),'≠'),'res new',550);
  }
  return b.html();
}
function negCheckHTML(g){
  var v=g.v,st=g.start,P=function(n){return '<span class="plug">('+num(v)+')</span>'};
  function line(a,b){
    var t1=(a===1?'':a===-1?'−':num(a))+P(),pr=a*v,tot=pr+b;
    return t1+(b<0?' − ':' + ')+Math.abs(b)+' = '+num(pr)+(b<0?' − ':' + ')+Math.abs(b)+' = <b>'+num(tot)+'</b>';
  }

    '<p class="cap2 new" style="font-family:var(--mono);font-size:1.15rem;color:var(--pink)">Left: '+line(st.a,st.b)+'</p>'+
    '<p class="cap2 new" style="font-family:var(--mono);font-size:1.15rem;color:var(--green);animation-delay:500ms">Right: '+line(st.c,st.d)+'</p>'+
    '<p class="match new" style="animation-delay:1000ms"><svg class="tick" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>'+num(wl)+' = '+num(wr)+'. Both sides match.</p></div>';
}
function checkHTML(g){
  if(isNeg())return negCheckHTML(g);
  var a=g.start.a,b=g.start.b,c=g.start.c,d=g.start.d,v=g.v,wl=a*v+b,wr=c*v+d;
  var pl=function(n){return '<span class="plug">'+n+'</span>'};
  function mk(a,b,f){return [a>0?f(a):'',(a>0&&b>0)?'<span class="pl">+</span>':'',(b>0||a===0)?String(b):'']}
  var A=function(a,b){return mk(a,b,function(n){return n>1?n+'('+pl(v)+')':pl(v)})};
  var B=function(a,b){return mk(a,b,function(n){return String(n*v)})};
  var gb=gridBuilder();
  gb.row(A(a,b).concat(['=']).concat(A(c,d)),'new',0);
  gb.row(B(a,b).concat(['=']).concat(B(c,d)),'new',500);
  gb.line('new',900);
  gb.row(['','',String(wl),'=',String(wr),'',''],'res new',1100);
  return '<div class="check"><p class="cap2">Put <i>x</i> = '+v+' into the original</p><div class="gridwrap"><div class="grid">'+gb.html()+'</div></div>'+
    '<p class="match new" style="animation-delay:1600ms"><svg class="tick" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>'+wl+' = '+wr+'. Both sides match.</p></div>';
}
function finishHTML(g){

/* ---------- scale ---------- */
var CX=380,PY=80,L=232,STR=205;
var sc={angle:0,raf:0};
var panL=$('#panL'),panR=$('#panR'),beam=$('#beam'),badge=$('#badge');
function setAngle(deg){
  sc.angle=deg;var r=deg*Math.PI/180;
  var lx=CX-L*Math.cos(r),ly=PY+L*Math.sin(r),rx=CX+L*Math.cos(r),ry=PY-L*Math.sin(r);
  beam.setAttribute('x1',lx);beam.setAttribute('y1',ly);beam.setAttribute('x2',rx);beam.setAttribute('y2',ry);
  panL.setAttribute('transform','translate('+lx+' '+(ly+STR)+')');
  panR.setAttribute('transform','translate('+rx+' '+(ry+STR)+')');
}
function tween(target,ms){
  cancelAnimationFrame(sc.raf);
  if(reduce){setAngle(target);return}
  var from=sc.angle,t0=performance.now();
  (function f(t){
    var p=Math.min(1,(t-t0)/ms);
    var d=(from-target)*Math.exp(-4.6*p)*Math.cos(p*Math.PI*3.2);
    setAngle(p>=1?target:target+d);
    if(p<1)sc.raf=requestAnimationFrame(f);
  })(t0);
}
function exprSvg(a,b){
  var s='';
  if(a!==0)s+=(a<0?'−':'')+(Math.abs(a)>1?Math.abs(a):'')+'<tspan class="xi">x</tspan>';
  if(a!==0&&b!==0)s+=(b<0?' − ':' + ')+Math.abs(b);
  else if(a===0)s+=num(b);
  return s;
}
function panHTML(nx,nu,label,word,enter){
  var W=250,bs=nx>4?40:46,bg=6,us=nu>12?19:23,ug=3;
  var px=Math.floor((W+bg)/(bs+bg)),pu=Math.floor((W+ug)/(us+ug));
  var out='<line class="str" x1="0" y1="'+(-STR)+'" x2="-122" y2="2"/><line class="str" x1="0" y1="'+(-STR)+'" x2="122" y2="2"/>';
  var i,r,inRow,col,w,x,y,xr=Math.ceil(nx/px);
  for(i=0;i<nx;i++){
    r=Math.floor(i/px);inRow=mn(px,nx-r*px);col=i%px;
    w=inRow*bs+(inRow-1)*bg;x=-w/2+col*(bs+bg);y=-4-(r+1)*bs-r*bg;
    out+='<g class="it xb'+(enter?' enter':'')+'" data-k="x" data-i="'+i+'" style="animation-delay:'+(enter?mn(i,12)*40:0)+'ms"><rect x="'+x+'" y="'+y+'" width="'+bs+'" height="'+bs+'" rx="8"/><text x="'+(x+bs/2)+'" y="'+(y+bs*.7)+'" font-size="'+(bs*.66)+'">x</text></g>';
  }
  var top=nx?-4-xr*bs-(xr-1)*bg:-2,base=top-(nx?6:2);
  for(i=0;i<nu;i++){
    r=Math.floor(i/pu);inRow=mn(pu,nu-r*pu);col=i%pu;
    w=inRow*us+(inRow-1)*ug;x=-w/2+col*(us+ug);y=base-(r+1)*us-r*ug;
    out+='<g class="it ub'+(enter?' enter':'')+'" data-k="u" data-i="'+i+'" style="animation-delay:'+(enter?mn(i,20)*25+120:0)+'ms"><rect x="'+x+'" y="'+y+'" width="'+us+'" height="'+us+'" rx="5"/></g>';
  }
  out+='<path class="bowl" d="M-135 0 H135 L110 18 H-110 Z"/>';
  out+='<text class="plabel" x="0" y="58">'+label+'</text><text class="pside" x="0" y="84">'+word+'</text>';
  return out;
}
/* ---------- algebra tiles (Negatives tab) ---------- */
function tileRow(old,add,kind,enter){
  var h='',na=Math.abs(old),nb=Math.abs(add||0),pairs=old*add<0?mn(na,nb):0,i;
  function t(n,cls,d){
    var lab=kind==='x'?(n<0?'−x':'x'):(n<0?'−':'+');
    return '<span class="tile '+kind+' '+(n<0?'neg':'pos')+cls+(enter?' enter':'')+'" style="animation-delay:'+d+'ms">'+lab+'</span>';
  }
  /* zero pairs first, each red tile stacked right under its matching tile, then the leftovers */
  for(i=0;i<pairs;i++)h+='<span class="pr" style="animation-delay:'+mn(i,12)*40+'ms">'+t(old,'',0)+t(add,' new',0)+'</span>';
  for(i=pairs;i<na;i++)h+=t(old,'',enter?mn(i,12)*30:0);
  for(i=pairs;i<nb;i++)h+=t(add,' new',mn(i,12)*30);
  return h;
}
function sideTiles(a,b,dx,du,word,cls,enter){

    h+='<h2>An equation is a level scale.</h2><p class="lead">Both sides weigh the same. That is what = means.</p><div class="row"><button class="btn fill yellow big" data-act="wnext">Next</button></div>';
  }else if(S.beat===1){
    h+='<h2><i style="font-family:var(--mono)">x</i> is a mystery box.</h2><p class="lead">Every <i>x</i> weighs the same. How much is one <i>x</i>?</p><div class="choices">';
    [1,2,3,4].forEach(function(n){h+='<button class="choice'+(S.guessOk&&n===3?' ok':'')+(S.guessBad===n?' bad':'')+'" data-act="guess" data-n="'+n+'">'+n+'</button>'});
    h+='</div><div class="row"><button class="btn line big" data-act="wback">Back</button>';
    if(S.guessOk)h+='<button class="btn fill yellow big" data-act="wnext">Next</button>';
    h+='</div>';
  }else{
    h+='<h2>Now <i style="font-family:var(--mono)">x</i> is on both sides.</h2>'+stepsHTML()+'<div class="row"><button class="btn line big" data-act="wback">Back</button><button class="btn fill yellow big" data-act="tab" data-tab="guided">Start solving</button></div><p class="small">Whole numbers first. Negative numbers are in tab 4.</p>';
  }
  return h+'</div>';
}
function render(o){
  o=o||{};
  document.querySelectorAll('.tab[data-tab]').forEach(function(b){b.classList.toggle('on',b.dataset.tab===S.tab)});
  el.bar.innerHTML=barHTML();
  el.ctl.innerHTML=ctlHTML();
  if(S.tab==='warm'){
    var w=WARM[S.beat];
    el.right.innerHTML=warmHTML();
    showScale(w.s,w.v,{enter:o.enter});
  }else{
    var g=game(),s=cur(g);
    var h='<div class="card"><div class="cap"><span>Your work</span><span><b class="pk">left</b><b class="gr">right</b></span></div><div class="gridwrap"><div class="grid">'+workHTML(g)+'</div></div></div>';
    if(isSolved(s)&&!g.cheat)h+=finishHTML(g);
    el.right.innerHTML=h;
    if(isNeg())showTiles(view(g),{enter:o.enter});
    else showScale(view(g),g.v,{enter:o.enter,nudge:o.nudge});
  }
  $('#scale').style.display=isNeg()?'none':'';$('#tiles').hidden=!isNeg();
  paint();
}
function intro(){
  if(S.tab==='warm')say(['Count each side. Same weight on both.','Pick a number for <i>x</i>.','<i>x</i> is on both sides this time.'][S.beat],'info');
  else if(S.tab==='guided')say('Type a number in the glowing box, then press Go. It acts on both sides.','info');
  else if(isNeg()){var gn=G.neg;say(gn.note||'Red tiles are negative. A red tile and a matching positive tile make zero. Choose Add or Subtract, type how many, then press Go.','info')}
  else{var g=G.practice;say(g.note||'Pick a move, type how many, then press Go. It happens on both sides.','info')}
}
function setTab(t){
  if(S.busy)return;
  S.tab=t;S.hintMv=null;intro();render({enter:true});
}

/* ---------- actions ---------- */
function flashBtn(act){
  var b=$('[data-act="'+act+'"]');if(!b)return;
  b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
}
function move(t){
  if(S.busy)return;
  var g=game(),s=cur(g);
  if(g.cheat){say('Put it back first.','warn');flashBtn('cheat');return}
  if(isSolved(s)){say('<i>x</i> is already alone. Plug it back in.','good');return}
  if(!ready(t,s)){say(notReady(t,s),'warn');flashBtn(t);return}
  var box=$('#amt-'+t),k=box?parseInt(box.value,10):NaN,why=badAmount(t,s,k);
  if(why){say(why,'warn');flashBtn(t);if(box){box.focus();box.select()}return}
  S.busy=true;S.hintMv=null;
  var r=applyMove(t,s,k);popTo(s,r.to);
  setTimeout(function(){
    g.hist.push({type:t,m:r.m,from:s,to:r.to});g.checked=false;
    var done=isSolved(r.to);
    if(done&&typeof g.idx==='number')S.done[g.idx]=true;
    var txt=t==='subx'?'Took '+r.m+' <i>x</i>'+(r.m>1?'\'s':'')+' off each side. Still level.':
            t==='subc'?'Took '+r.m+' off each side. Still level.':
            'Split each side into '+r.m+' equal piles. Kept one pile.';
    say(done?'<i>x</i> is alone. Now plug it back in.':txt,done?'good':'info');
    S.busy=false;S.fresh=true;render({nudge:true});S.fresh=false;
    if(done){var f=$('#finish');if(f)setTimeout(function(){f.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'})},350)}
  },reduce?60:520);
}
function negMove(t){
  if(S.busy)return;
  var g=game(),s=cur(g);
  if(isSolved(s)){say('<i>x</i> is already alone. Plug it back in.','good');return}
  var box=$('#amt-'+t),k=box?parseInt(box.value,10):NaN,why=negBad(t,s,k);
  if(why){say(why,'warn');flashBtn('n'+t);if(box){box.focus();box.select()}return}
  var type=t==='div'?'div':(($('#op-'+t)||{}).value==='sub'?'sub':'add')+(t==='x'?'x':'c');
  var r=applyMove(type,s,k);
  if(type!=='div'&&r.to.a===0&&r.to.c===0){say('That would remove every <i>x</i>. Try a different amount.','warn');flashBtn('n'+t);return}
  S.hintMv=null;
  var add=type.slice(0,3)==='add',sg=add?k:-k;
  var txt=type==='div'?'Divided both sides by '+num(k)+'. Still equal.':(add?'Added ':'Subtracted ')+(t==='x'?xt(k):k)+(add?' to':' from')+' both sides. Still equal.';
  function finish(){
    g.hist.push({type:type,m:k,from:s,to:r.to});g.checked=false;
    var done=isSolved(r.to);
    if(done&&typeof g.idx==='number')S.done[dkey(g.idx)]=true;
    say(done?'<i>x</i> is alone. Now plug it back in.':txt,done?'good':'info');
    S.busy=false;S.fresh=true;render({});S.fresh=false;
    if(done){var f=$('#finish');if(f)setTimeout(function(){f.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'})},350)}
  }
  if(type==='div'||reduce){finish();return}
  var o=t==='x'?{dx:sg}:{du:sg};
  var zp=t==='x'?(s.a*sg<0||s.c*sg<0):(s.b*sg<0||s.d*sg<0);
  S.busy=true;showTiles(s,o);
  say((add?'Adding ':'Subtracting ')+(t==='x'?xt(k):k)+' on both sides'+(add?'':' means adding '+(t==='x'?xt(-k):num(-k))+' tiles')+'.'+(zp?' Each boxed pair makes zero.':''),'info');
  if(!zp){setTimeout(finish,900);return}
  setTimeout(function(){document.querySelectorAll('#tiles .pr').forEach(function(e){e.classList.add('pop')})},1600);
  setTimeout(finish,2250);
}
function hint(){
  if(S.busy)return;
  var g=game(),s=cur(g);
  if(g.cheat){say('Put it back first. Then follow the glow.','warn');S.hintMv=null;return}
  if(isSolved(s)){say('You are done. Plug it back in to check.','good');return}
  if(isNeg()){S.hintMv=negNext(s);say(negHint(s),'hint');el.ctl.innerHTML=ctlHTML();return}
  var mv=nextMove(s);S.hintMv=mv;say(hintText(mv,s),'hint');
  el.ctl.innerHTML=ctlHTML();
}
function undo(){
  if(S.busy)return;
  var g=game();S.hintMv=null;
  if(g.cheat){unCheat(g);return}
  if(!g.hist.length){say('Nothing to undo yet.','warn');return}
  g.hist.pop();g.checked=false;say('Undone.','info');render({enter:true});
}
function reset(){
  if(S.busy)return;
  var g=game();g.hist=[];g.cheat=null;g.checked=false;S.hintMv=null;
  say('Fresh start.','info');render({enter:true});
}
function unCheat(g){g.cheat=null;say('Put back. Level again.','good');render({enter:true})}
function cheat(){
  if(S.busy)return;
  var g=game();S.hintMv=null;
  if(g.cheat){unCheat(g);return}
  var s=cur(g),c;
  if(s.b>0)c={side:'L',kind:'c',m:mn(2,s.b)};
  else if(s.d>0)c={side:'R',kind:'c',m:mn(2,s.d)};
  else if(s.a>0)c={side:'L',kind:'x',m:1};
  else c={side:'R',kind:'x',m:1};
  S.busy=true;
  var t={a:s.a,b:s.b,c:s.c,d:s.d};
  if(c.side==='L'){if(c.kind==='c')t.b-=c.m;else t.a-=c.m}else{if(c.kind==='c')t.d-=c.m;else t.c-=c.m}
  popTo(s,t);
  setTimeout(function(){
    g.cheat=c;S.busy=false;
    var side=c.side==='L'?'left':'right',what=c.kind==='c'?(c.m>1?c.m+' ones':'1 one'):'1 <i>x</i>';
    say('Only the '+side+' lost '+what+'. The scale tips. Whatever you do to one side, do to the other.','bad');
    render();
  },reduce?60:480);
}
function startGame(p,idx){
  if(S.busy)return;
  G[isNeg()?'neg':'practice']=mkGame(p,idx);S.hintMv=null;intro();render({enter:true});
}
function nextPuzzle(){
  var i=game().idx,L=list();
  if(typeof i==='number'&&i<L.length-1)startGame(L[i+1],i+1);
  else startGame(isNeg()?randomNeg():randomPuzzle(),'R');
}
function guess(n){
  if(S.guessOk)return;
  if(n===3){S.guessOk=true;S.guessBad=null;say('3 + 2 = 5. Level! <i>x</i> = 3.','good')}
  else{S.guessBad=n;say(n+' + 2 = '+(n+2)+', not 5. Try again.','warn')}
  render();
}
function wnext(){S.beat=mn(2,S.beat+1);intro();render({enter:true})}
function wback(){S.beat=Math.max(0,S.beat-1);intro();render({enter:true})}

function openHow(){$('#howsteps').innerHTML=stepsHTML();$('#how').hidden=false;var b=$('#how [data-act="close"]');if(b)b.focus()}
function closeHow(){$('#how').hidden=true}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b){if(e.target.id==='how')closeHow();return}
  var a=b.dataset.act;
  if(a==='tab')setTab(b.dataset.tab);
  else if(a==='how')openHow();
  else if(a==='close')closeHow();
  else if(a==='subx'||a==='subc'||a==='div')move(a);
  else if(a==='hint')hint();
  else if(a==='undo')undo();
  else if(a==='reset')reset();
  else if(a==='cheat')cheat();
  else if(a==='nx'||a==='nc'||a==='ndiv')negMove(a.slice(1));
  else if(a==='pick')startGame(list()[+b.dataset.i],+b.dataset.i);
  else if(a==='rand')startGame(isNeg()?randomNeg():randomPuzzle(),'R');
  else if(a==='next')nextPuzzle();
  else if(a==='check'){game().checked=true;render();var f=$('#finish');if(f)f.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'})}
  else if(a==='guess')guess(+b.dataset.n);
  else if(a==='wnext')wnext();
  else if(a==='wback')wback();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeHow();else if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('amt')){e.preventDefault();if(isNeg())negMove(e.target.dataset.t);else move(e.target.dataset.t)}});

setAngle(0);intro();render({enter:true});
})();
</script>

</body></html>
