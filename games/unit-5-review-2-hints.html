<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Need a Hint?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
:root{--bg:#000;--panel:#0d0d12;--panel2:#15151c;--line:#2a2a35;--fg:#f5f5f8;--mute:#a2a2b6;--violet:#b9a0ff;--cyan:#33d6ff;--yellow:#ffd23d;
  --disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:clamp(17px,.6vw + 13px,22px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;padding:1rem 16px 4rem}
.app{max-width:720px;margin:0 auto}
i{font-style:italic} sup{font-size:.7em}
h1{font:800 2rem/1 var(--disp);margin:.2rem 0 .3rem;color:var(--violet)}
.sub{color:var(--mute);margin:0 0 1rem}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:1rem}
.lab{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:0 0 .4rem}
.qn{display:inline-grid;place-items:center;min-width:2.6rem;height:2.6rem;border-radius:12px;background:var(--cyan);color:#000;font:800 1.4rem var(--disp);margin-right:.5rem;vertical-align:middle}
.graph{display:block;width:100%;max-width:380px;margin:.8rem auto 0}
.g-grid{stroke:#2c2c3a;stroke-width:1}.g-axis{stroke:var(--fg);stroke-width:2.5;fill:none}.g-arrow{fill:var(--fg)}
.g-lab{fill:var(--fg);font:italic 600 17px var(--body)}.g-curve{stroke:var(--cyan);stroke-width:4;fill:none}.g-dot{fill:var(--cyan)}
.g-num{fill:var(--mute);font:500 15px var(--body)}.g-title{fill:var(--mute);font:600 15px var(--body)}.g-dot.open{fill:#000;stroke:var(--cyan);stroke-width:3}.rt{white-space:nowrap}.rt>span{border-top:2px solid currentColor;padding:0 .1em;margin-left:.05em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 .1em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.pq{font-weight:600;margin:0 0 .6rem}
.hint{border-left:5px solid var(--violet);background:rgba(185,160,255,.08);padding:.6rem .9rem;border-radius:0 12px 12px 0;margin-bottom:.5rem}
.hint b{color:var(--violet);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;display:block}
button{font:600 1rem var(--body);color:var(--violet);background:transparent;border:2px solid var(--violet);border-radius:12px;min-height:3rem;padding:.4rem 1rem;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.6rem,1fr));gap:.5rem}
.list a{display:grid;place-items:center;min-height:3.6rem;border-radius:12px;border:2px solid var(--line);color:var(--fg);text-decoration:none;font:800 1.3rem var(--disp)}
.note{color:var(--mute);font-size:.9rem}
.alt{font:600 1.5rem/1.5 var(--body);margin:0 0 .6rem;color:var(--yellow)}
.back{color:var(--violet)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="unit-5-review-2-data.js"></script>
<script>
'use strict';
const U = window.U5R2, app = document.getElementById('app');
const n = +new URLSearchParams(location.search).get('q'), q = U.byN(n);
if (q && q.alt && new URLSearchParams(location.search).get('alt')) {
  document.title = q.alt.title + ': Station ' + n;
  app.innerHTML = '<p class="lab">Unit 5 Review #2</p><h1>' + q.alt.title + '</h1><p class="sub">Station ' + n + '</p>' +
    '<section class="card"><p class="lab"><span class="qn">' + n + '</span>Station ' + n + '</p><div>' + q.text + '</div>' + (q.graph ? U.graph(q.graph) : '') + '</section>' +
    '<section class="card"><p class="alt">' + q.alt.html + '</p><p class="note">' + q.alt.note + '</p></section>' +
    '<p><a class="back" href="?q=' + n + '">Need a hint instead?</a></p>';
} else if (!q || !q.ready) {
  app.innerHTML = '<h1>Need a hint?</h1><p class="sub">Unit 5 Review #2. Pick your station.</p><div class="list">' +
    U.READY.map(x => '<a href="?q=' + x.n + '">' + x.n + '</a>').join('') + '</div>';
} else {
  document.title = 'Hint: Station ' + n;
  const shown = q.parts.map(() => 0);
  const draw = () => {
    app.innerHTML = '<p class="lab">Unit 5 Review #2</p><h1>Need a hint?</h1><p class="sub">Open one hint at a time. Try the next step before you open another!</p>' +
      '<section class="card"><p class="lab"><span class="qn">' + n + '</span>Station ' + n + '</p><div>' + q.text + '</div>' + (q.graph ? U.graph(q.graph) : '') + '</section>' +
      q.parts.map((p, k) => '<section class="card"><p class="lab">' + (q.parts.length > 1 ? 'Part ' + (k + 1) : 'The question') + '</p><p class="pq">' + p.q + '</p>' +
        p.hints.slice(0, shown[k]).map((h, i) => '<div class="hint"><b>Hint ' + (i + 1) + '</b>' + h + '</div>').join('') +
        (shown[k] < p.hints.length ? '<button data-k="' + k + '">' + (shown[k] ? 'Show the next hint' : 'Show a hint') + '</button>' : '<p class="note">That’s every hint for this part. Ask your teacher if you are still stuck.</p>') +
        '</section>').join('');
  };
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    const k = +b.dataset.k; shown[k]++; draw(); log(k, shown[k]);
  });
  draw();
  let sid = null;
  const log = async (part, level) => {
    if (!U.dbBase()) return;
    sid = sid || (await U.currentSession()).id;
    U.dbPush('sessions/' + sid + '/hints/q' + n, { t: Date.now(), part, level });
  };
}
</script>
</body>
</html>
